[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  port = 4321
  targetPort = 4321
  framework = "#custom"

# Netlify Forms auto-detection needs a static form in the built HTML.
# BaseLayout.astro renders a hidden static form for newsletter + rsvp
# so Netlify's post-processor sees them at deploy time.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old React-SPA fallback removed — Astro emits real static files per route.
# Netlify Identity for /admin still handled by widget in admin/index.html.

[[redirects]]
  from = "/blog/*"
  to = "/feed/:splat"
  status = 301

[[redirects]]
  from = "/newsletter"
  to = "/#newsletter"
  status = 301
